name: "loupe"
description: "AI PR reviewer that posts inline comments, harness-agnostic, reads your repo's own conventions."
branding:
  icon: "search"
  color: "purple"
inputs:
  github-token:
    description: "Token used to read the PR and post the review."
    required: true
    default: ${{ github.token }}
  harness:
    description: "Which agent CLI to review with (whip, claude, codex)."
    required: false
    default: "whip"
  model:
    description: "Model id for the harness (e.g. kimi-k3, claude-opus-4-8)."
    required: false
    default: "kimi-k3"
  reasoning:
    description: "Reasoning effort: low, medium, or high."
    required: false
    default: "medium"
  prompt-file:
    description: "Path to a custom reviewer-guidance file (output contract still enforced)."
    required: false
    default: ""
  credential-providers:
    description: "Comma-separated credential provider chain (env, dotenv, infisical)."
    required: false
    default: "env"
  convention-paths:
    description: "Comma-separated repo docs to enforce, in priority order."
    required: false
    default: "CLAUDE.md,AGENTS.md,.loupe.md,CONTRIBUTING.md"
  dir:
    description: "Restrict the review to a repo subdirectory (e.g. inference)."
    required: false
    default: ""
  config:
    description: "Path to a .loupe.json reviewer-profiles config (runs each matching reviewer)."
    required: false
    default: ""
  reviewer:
    description: "Run only this named reviewer from the config."
    required: false
    default: ""
  profile:
    description: "Noise profile: quiet | chill | assertive."
    required: false
    default: "chill"
  verify:
    description: "Run the second-opinion verification pass (true/false)."
    required: false
    default: "true"
  full:
    description: "Review the whole PR instead of the incremental delta (true/false)."
    required: false
    default: "false"
  ensemble:
    description: "Comma-separated models to ensemble; keep findings a majority agree on."
    required: false
    default: ""
  skills:
    description: "Comma-separated skill paths (SKILL.md or skill dir) to fold into the reviewer."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.14"
    - shell: bash
      working-directory: ${{ github.action_path }}
      run: bun install --frozen-lockfile
    - shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        LOUPE_HARNESS: ${{ inputs.harness }}
        LOUPE_MODEL: ${{ inputs.model }}
        LOUPE_REASONING: ${{ inputs.reasoning }}
        LOUPE_PROMPT_FILE: ${{ inputs.prompt-file }}
        LOUPE_CREDENTIAL_PROVIDERS: ${{ inputs.credential-providers }}
        LOUPE_CONVENTION_PATHS: ${{ inputs.convention-paths }}
        LOUPE_DIR: ${{ inputs.dir }}
        LOUPE_CONFIG: ${{ inputs.config }}
        LOUPE_REVIEWER: ${{ inputs.reviewer }}
        LOUPE_PROFILE: ${{ inputs.profile }}
        LOUPE_VERIFY: ${{ inputs.verify }}
        LOUPE_FULL: ${{ inputs.full }}
        LOUPE_ENSEMBLE: ${{ inputs.ensemble }}
        LOUPE_SKILLS: ${{ inputs.skills }}
      run: bun run packages/action/src/main.ts
