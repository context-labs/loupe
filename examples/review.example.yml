# Copy into a consuming repo as .github/workflows/loupe.yml, or reference loupe
# as a reusable/required workflow at the org level. Three variants below.
name: loupe
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write # required to post the inline review

jobs:
  # --- Variant A: internal (whip + inference.net) ---------------------------
  # whip self-authenticates from its own login; nothing to wire but the login.
  review-whip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: context-labs/loupe@v0
        with:
          harness: whip
          model: kimi-k3
          reasoning: medium
          dir: inference # scope a monorepo to one folder (optional)

  # --- Variant B: external (claude + API key secret) ------------------------
  review-claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: context-labs/loupe@v0
        with:
          harness: claude
          model: claude-opus-4-8
          reasoning: high
        env:
          # The harness CLI reads this; loupe's env provider forwards it in.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # --- Variant C: custom reviewer prompt ------------------------------------
  # Point prompt-file at a doc in your repo. Your guidance replaces the default;
  # loupe still appends the JSON output contract, so parsing can't break.
  review-custom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: context-labs/loupe@v0
        with:
          harness: whip
          prompt-file: .github/loupe-prompt.md

  # --- Variant D: config-driven (recommended for multiple repos) ------------
  # Put ALL review policy in .loupe.json — harness, model, timezone, dir, the
  # whip provider + model panel, and the reviewers. The workflow then only
  # provisions: checkout, the harness binary, and the secret. Nothing to repeat
  # across repos or between the review and chat workflows.
  review-config:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # if you fetch the key from an OIDC secrets manager
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      # install your harness binary here (e.g. curl the whip release), then:
      - uses: context-labs/loupe@v0
        with:
          config: .loupe.json # harness/model/timezone/dir/whip all live here
        env:
          # only the secret value stays in the workflow; its NAME is in .loupe.json
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
