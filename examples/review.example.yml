# Copy into a consuming repo as .github/workflows/loupe.yml, or reference loupe
# as a reusable/required workflow at the org level. Three variants below.
name: loupe
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write # required to post the inline review

jobs:
  # --- Variant A: flags only ------------------------------------------------
  # The whip daemon self-authenticates from its own login; nothing to wire but
  # the login and the whipcode binary (loupe downloads the pinned release when
  # it is missing from PATH).
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: context-labs/loupe@v0
        with:
          model: kimi-k3
          reasoning: medium
          dir: inference # scope a monorepo to one folder (optional)

  # --- Variant B: custom reviewer prompt ------------------------------------
  # Point prompt-file at a doc in your repo. Your guidance replaces the default;
  # loupe still appends the JSON output contract, and the whip daemon enforces
  # it on the reviewer's final message, so parsing can't break.
  review-custom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: context-labs/loupe@v0
        with:
          prompt-file: .github/loupe-prompt.md

  # --- Variant C: config-driven (recommended for multiple repos) ------------
  # Put ALL review policy in .loupe.json — model, timezone, dir, the whip
  # provider + model panel, and the reviewers. The workflow then only
  # provisions: checkout, the whipcode binary, and the secret. Nothing to repeat
  # across repos or between the review and chat workflows.
  review-config:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # if you fetch the key from an OIDC secrets manager
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Install whipcode (the release in loupe's vendor/@whip/VERSION)
        run: |
          curl -fsSL -o whipcode https://github.com/context-labs/whip/releases/download/v1.0.0/whipcode-linux-x64
          chmod +x whipcode && sudo mv whipcode /usr/local/bin/whipcode
      - uses: context-labs/loupe@v0
        with:
          config: .loupe.json # model/timezone/dir/whip all live here
        env:
          # only the secret value stays in the workflow; its NAME is in .loupe.json.
          # loupe starts a dedicated whip daemon in a throwaway home with it.
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
