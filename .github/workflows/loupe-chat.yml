name: "loupe chat"

# Answers @loupe mentions on loupe's own PRs (review | fix | question | help).
# Separate file from the self-review so neither shows as a perpetually "skipped"
# job on the other's events.
#
# loupe is PUBLIC: this runs with secrets and contents: write, so it is gated to
# trusted commenters (OWNER/MEMBER/COLLABORATOR).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  id-token: write # OIDC for Infisical
  contents: write # @loupe fix pushes a commit
  pull-requests: write

concurrency:
  group: loupe-chat-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  INFISICAL_IDENTITY_ID: "46f034e9-14e7-49ad-b3f7-f0d8ad8a989f" # Github-Ci

jobs:
  chat:
    name: "loupe chat"
    runs-on: ubuntu-latest
    continue-on-error: true
    if: >-
      ( github.event_name == 'pull_request_review_comment' ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) ) &&
      contains(github.event.comment.body, '@loupe') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    steps:
      - uses: actions/checkout@v5
      - name: Install whip (pinned v0.6.5)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pin to v0.6.5 — the last release whose binary installs as `whip`.
          # (v1.0.0 renamed the binary to `whipcode`.) The harness resolves
          # either name, but CI stays on the pinned `whip` for stability.
          tag="v0.6.5"
          echo "Installing whip $tag"
          gh release download "$tag" --repo context-labs/whip --pattern "*-linux-x64" --output whip --clobber
          chmod +x whip
          sudo mv whip /usr/local/bin/whip
          whip --version || true
      - name: Load loupe secrets from Infisical
        continue-on-error: true
        uses: Infisical/secrets-action@v1.0.15
        with:
          method: "oidc"
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: "ci-cd"
          env-slug: dev
          secret-path: "/loupe"
          include-imports: true
      - name: Respond
        continue-on-error: true
        uses: context-labs/loupe@main
        with:
          config: .loupe/config.json
        env:
          INFERENCE_API_KEY: ${{ env.INFERENCE_NET_API_KEY }}
          LOUPE_ALLOWED_PROVIDER_HOSTS: api.inference.net
