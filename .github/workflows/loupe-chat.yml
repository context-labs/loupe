name: "loupe chat"

# Answers @loupe mentions on loupe's own PRs (review | fix | question | help).
# Separate file from the self-review so neither shows as a perpetually "skipped"
# job on the other's events.
#
# loupe is PUBLIC: this runs with secrets and contents: write, so it is gated to
# trusted commenters (OWNER/MEMBER/COLLABORATOR).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  id-token: write # OIDC for Infisical
  contents: write # @loupe fix pushes a commit
  pull-requests: write

concurrency:
  group: loupe-chat-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  INFISICAL_IDENTITY_ID: "46f034e9-14e7-49ad-b3f7-f0d8ad8a989f" # Github-Ci

jobs:
  chat:
    name: "loupe chat"
    runs-on: ubuntu-latest
    continue-on-error: true
    if: >-
      ( github.event_name == 'pull_request_review_comment' ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) ) &&
      contains(github.event.comment.body, '@loupe') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    steps:
      - uses: actions/checkout@v5
      - name: Install whip (latest release)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo context-labs/whip --json tagName -q .tagName)
          echo "Installing whip $tag"
          curl -fsSL -o whip \
            "https://github.com/context-labs/whip/releases/download/${tag}/whip-linux-x64"
          chmod +x whip
          sudo mv whip /usr/local/bin/whip
          whip --version || true
      - name: Load loupe secrets from Infisical
        continue-on-error: true
        uses: Infisical/secrets-action@v1.0.15
        with:
          method: "oidc"
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: "ci-cd"
          env-slug: dev
          secret-path: "/loupe"
          include-imports: true
      - name: Respond
        continue-on-error: true
        uses: context-labs/loupe@v0
        with:
          config: .loupe/config.json
        env:
          INFERENCE_API_KEY: ${{ env.INFERENCE_NET_API_KEY }}
