name: "loupe self-review"

# loupe dogfooding loupe: reviews its own PRs with the config in .loupe/config.json
# (whip, kimi-k3 + panel, maxTurns 5). Advisory and non-blocking — the required
# check is CI (ci.yml); this never gates a merge. @loupe chat lives in
# loupe-chat.yml.
#
# loupe is PUBLIC: this job is gated to same-repo branch PRs (fork PRs get no
# OIDC/secrets), so untrusted fork code never runs with the inference key.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  id-token: write # OIDC for Infisical
  contents: read
  pull-requests: write

concurrency:
  group: loupe-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  INFISICAL_IDENTITY_ID: "46f034e9-14e7-49ad-b3f7-f0d8ad8a989f" # Github-Ci

jobs:
  loupe:
    name: "loupe self-review"
    runs-on: ubuntu-latest
    continue-on-error: true
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
      - name: Install whip (pinned v0.6.5)
        # A failed install means the harness is broken — fail the check.
        # (Deterministic pinned download; there is nothing advisory here.)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pin to v0.6.5 — the last release whose binary installs as `whip`.
          # (v1.0.0 renamed the binary to `whipcode`.) The harness resolves
          # either name, but CI stays on the pinned `whip` for stability.
          tag="v0.6.5"
          echo "Installing whip $tag"
          gh release download "$tag" --repo context-labs/whip --pattern "*-linux-x64" --output whip --clobber
          chmod +x whip
          sudo mv whip /usr/local/bin/whip
          whip --version || true
      - name: Load loupe secrets from Infisical
        continue-on-error: true
        uses: Infisical/secrets-action@v1.0.15
        with:
          method: "oidc"
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: "ci-cd"
          env-slug: dev
          secret-path: "/loupe"
          include-imports: true
      - name: Review
        # Keep advisory: loupe findings are comments, not a merge gate. The
        # `harness-health` gate below converts a broken harness (whip missing,
        # 404ing, renamed) into a red check instead of silent green.
        id: loupe-run
        continue-on-error: true
        uses: context-labs/loupe@main
        with:
          config: .loupe/config.json
        env:
          INFERENCE_API_KEY: ${{ env.INFERENCE_NET_API_KEY }}
      - name: Harness health gate
        # Fail the GitHub check when the whip harness is broken. `status`:
        # ok | quota | rate-limit | failed. harness/setup failures surface as
        # "failed"; quota/rate-limit are provider-side and stay advisory (INF-5559).
        if: always() && steps.loupe-run.outputs.status == 'failed'
        run: |
          echo "loupe review failed: the whip harness is broken (see the Review step logs)."
          exit 1
