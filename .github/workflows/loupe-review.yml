name: "loupe self-review"

# loupe dogfooding loupe: reviews its own PRs with the config in .loupe/config.json
# (whipcode v1.0.0, glm-5.3, maxTurns 15). Advisory and non-blocking — the required
# check is CI (ci.yml); this never gates a merge. @loupe chat lives in
# loupe-chat.yml.
#
# loupe is PUBLIC: this job is gated to same-repo branch PRs (fork PRs get no
# OIDC/secrets), so untrusted fork code never runs with the inference key.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  id-token: write # OIDC for Infisical
  contents: read
  pull-requests: write

concurrency:
  group: loupe-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  INFISICAL_IDENTITY_ID: "46f034e9-14e7-49ad-b3f7-f0d8ad8a989f" # Github-Ci

jobs:
  loupe:
    name: "loupe self-review"
    runs-on: ubuntu-latest
    continue-on-error: true
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
      - name: Install whipcode (pinned v1.0.0)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pin to the release loupe's vendored SDK came from (vendor/@whip/VERSION);
          # the SDK refuses a daemon from another protocol major. If this step
          # fails, loupe downloads the same tag itself at review time.
          tag="v1.0.0"
          echo "Installing whipcode $tag"
          gh release download "$tag" --repo context-labs/whip --pattern "whipcode-linux-x64" --output whipcode --clobber
          chmod +x whipcode
          sudo mv whipcode /usr/local/bin/whipcode
          whipcode --version || true
      - name: Load loupe secrets from Infisical
        continue-on-error: true
        uses: Infisical/secrets-action@v1.0.15
        with:
          method: "oidc"
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: "ci-cd"
          env-slug: dev
          secret-path: "/loupe"
          include-imports: true
      - name: Review
        continue-on-error: true
        uses: context-labs/loupe@main
        with:
          config: .loupe/config.json
        env:
          INFERENCE_API_KEY: ${{ env.INFERENCE_NET_API_KEY }}
